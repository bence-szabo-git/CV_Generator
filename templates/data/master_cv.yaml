    description: "VIBE Festival is the biggest Hungarian festival in Romania, bringing music, culture, and community by the Mureș River."
    logo_path: "data/logos/vibe.png"
    roles:
      - role: "Manager"
        location: "Târgu Mureș, Romania"
        dates: "06/25 - 07/25"
        bullets:
          - "Did Important Activities"
          - "Did Another Important Activities"
      - role: "Assistant"
        location: "Cluj-Napoca, Romania"
        dates: "03/24 - 09/24"
        bullets:
          - "Did this"
          - "Did that"

# ------------------------------------------------------------------
# Extracurricular — structure unchanged, no logo needed
# ------------------------------------------------------------------
