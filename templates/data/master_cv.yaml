# =============================================================
# data/master_cv.yaml
# Source of truth — all your information lives here.
# AI only touches: tailored_summary, experience[].roles[].bullets
# Everything else passes through untouched.
# =============================================================

contact:
  name: "FIRSTNAME LASTNAME"
  email: "email@email.com"
  phone: "+40712 123 123"
  linkedin: "linkedin.com/in/link"
  nationality: "Romanian, Hungarian"
  photo_path: "data/picture.png"

# ------------------------------------------------------------------
# Base summary — AI will tailor this per job application
# ------------------------------------------------------------------
base_summary: "Short Summary of Me..."

# ------------------------------------------------------------------
# Experience
# Each company has a logo and a list of roles.
# Multiple roles at the same company stay grouped under one block.
# ------------------------------------------------------------------
experience:
